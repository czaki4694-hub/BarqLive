name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Add Cairo font
        run: |
          mkdir -p app/src/main/res/font
          curl -fL -o cairo.ttf "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" \
            || curl -fL -o cairo.ttf "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bwght%5D.ttf"
          for n in regular bold black; do
            [ -f app/src/main/res/font/cairo_$n.ttf ] || cp cairo.ttf app/src/main/res/font/cairo_$n.ttf
          done

      - name: API key
        run: echo "FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BarqLive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
